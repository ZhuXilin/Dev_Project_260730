<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素缩放工具</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #16181d; color: #dfe3e9; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 10px; background: #22252b;
    border-bottom: 1px solid #33383f; flex: 0 0 auto;
  }
  .toolbar button {
    font: inherit; padding: 5px 11px; color: #dfe3e9;
    background: #2e333a; border: 1px solid #3d434c;
    border-radius: 6px; cursor: pointer; transition: background .12s;
    white-space: nowrap;
  }
  .toolbar button:hover:not(:disabled) { background: #3a4049; }
  .toolbar button:active:not(:disabled) { background: #262b32; }
  .toolbar button:disabled { opacity: .35; cursor: default; }
  .toolbar button.toggle.on {
    background: #2d6cdf; border-color: #4a8cf5; color: #fff;
  }
  .toolbar button.mini { padding: 5px 8px; min-width: 34px; font-variant-numeric: tabular-nums; }
  .toolbar .sep { width: 1px; height: 20px; background: #3d434c; margin: 0 2px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 5px; color: #a7aeb9; }
  .toolbar input[type="number"] {
    width: 78px; font: inherit; padding: 4px 6px;
    color: #dfe3e9; background: #191c21;
    border: 1px solid #3d434c; border-radius: 6px;
  }
  .toolbar input[type="number"]:focus { outline: none; border-color: #3b82f6; }
  .toolbar input[type="number"]::-webkit-outer-spin-button,
  .toolbar input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .toolbar input[type="checkbox"] { accent-color: #3b82f6; }
  .spacer { flex: 1; }
  .hint { color: #767e8a; font-size: 12px; }

  /* ---------- 画布区 ---------- */
  .stage {
    position: relative; flex: 1 1 auto; overflow: hidden;
    background-color: #1b1e23;
    background-image:
      linear-gradient(45deg, #202329 25%, transparent 25%),
      linear-gradient(-45deg, #202329 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #202329 75%),
      linear-gradient(-45deg, transparent 75%, #202329 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    touch-action: none;
  }
  .stage.select-mode { cursor: crosshair; }
  .placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: #5d6673; font-size: 14px; pointer-events: none;
  }
  .placeholder .big { font-size: 46px; opacity: .45; }

  .wrap {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0; display: none;
    box-shadow: 0 0 0 1px rgba(125,135,150,.7), 0 12px 48px rgba(0,0,0,.6);
  }
  .wrap.on { display: block; }
  .wrap canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: pixelated;
  }
  .wrap .sel-overlay {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    image-rendering: -moz-crisp-edges;
    image-rendering: pixelated;
    z-index: 4;
  }

  /* ---------- 手柄 ---------- */
  .handle {
    position: absolute; width: 11px; height: 11px;
    background: #fff; border: 1.5px solid #3b82f6; border-radius: 3px;
    box-shadow: 0 1px 4px rgba(0,0,0,.55); z-index: 5;
  }
  .handle[data-dir="nw"] { left: -6px;  top: -6px;                        cursor: nwse-resize; }
  .handle[data-dir="n"]  { left: calc(50% - 5.5px);  top: -6px;           cursor: ns-resize; }
  .handle[data-dir="ne"] { right: -6px; top: -6px;                        cursor: nesw-resize; }
  .handle[data-dir="e"]  { right: -6px; top: calc(50% - 5.5px);           cursor: ew-resize; }
  .handle[data-dir="se"] { right: -6px; bottom: -6px;                     cursor: nwse-resize; }
  .handle[data-dir="s"]  { left: calc(50% - 5.5px);  bottom: -6px;        cursor: ns-resize; }
  .handle[data-dir="sw"] { left: -6px;  bottom: -6px;                     cursor: nesw-resize; }
  .handle[data-dir="w"]  { left: -6px;  top: calc(50% - 5.5px);           cursor: ew-resize; }

  /* ---------- 状态栏 ---------- */
  .status {
    flex: 0 0 auto; display: flex; align-items: center; gap: 18px;
    padding: 5px 12px; background: #22252b;
    border-top: 1px solid #33383f; color: #8b929d; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .status .msg { color: #6fb0ff; }
  .status .hist { color: #9aa3af; }
  .status .sel-info { color: #7fd4ff; }
</style>
</head>
<body>
<div class="app">

  <div class="toolbar">
    <button id="btnOpen">打开图片</button>
    <button id="btnSave" disabled>保存 PNG</button>
    <button id="btnSaveAs" disabled>另存为…</button>
    <button id="btnClose" disabled>关闭</button>
    <div class="sep"></div>
    <button id="btnUndo" disabled title="Ctrl+Z">↶ 撤销</button>
    <button id="btnRedo" disabled title="Ctrl+Shift+Z / Ctrl+Y">↷ 重做</button>
    <div class="sep"></div>
    <button id="btnReset" disabled>原始尺寸</button>
    <button id="btnFit" disabled>适应窗口</button>
    <button id="btnOne" disabled>1:1</button>
    <div class="sep"></div>
    <button id="btnHalf"  class="mini" disabled title="缩小到 1/2">½</button>
    <button id="btnQuart" class="mini" disabled title="缩小到 1/4">¼</button>
    <button id="btnEighth" class="mini" disabled title="缩小到 1/8">⅛</button>
    <button id="btnDouble" class="mini" disabled title="放大到 2 倍">×2</button>
    <div class="sep"></div>
    <label>宽 <input id="inW" type="number" min="1" max="16384" step="1" disabled></label>
    <label>高 <input id="inH" type="number" min="1" max="16384" step="1" disabled></label>
    <label><input id="lockRatio" type="checkbox" checked> 锁定比例</label>
    <div class="sep"></div>
    <button id="btnSelect" class="toggle" disabled title="选择模式 (S)：在画布上拖拽框选">▢ 选择</button>
    <button id="btnSelectAll" disabled title="Ctrl+A">全选</button>
    <button id="btnSelectNone" disabled title="Esc / Ctrl+D">取消选择</button>
    <button id="btnSelectInv" disabled>反选</button>
    <button id="btnCopy" disabled title="Ctrl+C">📋 复制</button>
    <div class="spacer"></div>
    <span class="hint">拖手柄改像素 · 滚轮缩放视图 · 拖空白平移 · Shift 切换比例锁定</span>
  </div>

  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">
      <div class="big">🖼</div>
      <div>把图片拖到这里，或点击「打开图片」</div>
    </div>
    <div class="wrap" id="wrap">
      <canvas id="cv"></canvas>
      <canvas id="selCv" class="sel-overlay"></canvas>
      <div class="handle" data-dir="nw"></div>
      <div class="handle" data-dir="n"></div>
      <div class="handle" data-dir="ne"></div>
      <div class="handle" data-dir="e"></div>
      <div class="handle" data-dir="se"></div>
      <div class="handle" data-dir="s"></div>
      <div class="handle" data-dir="sw"></div>
      <div class="handle" data-dir="w"></div>
    </div>
  </div>

  <div class="status">
    <span id="stOrig">未打开图片</span>
    <span id="stCur"></span>
    <span id="stZoom"></span>
    <span class="sel-info" id="stSel"></span>
    <span class="hist" id="stHist"></span>
    <span class="spacer"></span>
    <span class="msg" id="stMsg"></span>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var stage       = $('stage');
  var wrap        = $('wrap');
  var cv          = $('cv');
  var ctx         = cv.getContext('2d');
  var selCv       = $('selCv');
  var selCtx      = selCv.getContext('2d');
  var placeholder = $('placeholder');
  var fileInput   = $('fileInput');
  var inW         = $('inW');
  var inH         = $('inH');
  var lockRatio   = $('lockRatio');
  var stOrig      = $('stOrig');
  var stCur       = $('stCur');
  var stZoom      = $('stZoom');
  var stSel       = $('stSel');
  var stHist      = $('stHist');
  var stMsg       = $('stMsg');

  var MAX_SIZE   = 16384;
  var MAX_PIXELS = 96e6;
  var MIN_ZOOM   = 0.02;
  var MAX_ZOOM   = 64;
  var MAX_HISTORY = 30;

  /* ---------- 源像素（永不改变） ---------- */
  var src32 = null;
  var srcW = 0, srcH = 0;

  /* ---------- 当前状态 ---------- */
  var hasImage = false;
  var targetW = 0, targetH = 0;
  var zoom = 1, panX = 0, panY = 0;
  var baseName = 'image';
  var fileHandle = null;

  /* ---------- 历史记录 ---------- */
  var history = [];
  var histIndex = -1;

  var drag = null;
  var panDrag = null;

  /* ---------- 选择状态 ---------- */
  var selectionMode = false;
  var selMask = null;              // Uint8Array(targetW * targetH)
  var hasSelection = false;
  var selBounds = { x: 0, y: 0, w: 0, h: 0 };
  var selDrag = null;              // { x0, y0, x1, y1, mode }

  /* ================= 小工具 ================= */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var msgTimer = 0;
  function setMsg(t, autoClear) {
    stMsg.textContent = t || '';
    clearTimeout(msgTimer);
    if (t && autoClear) {
      msgTimer = setTimeout(function () { stMsg.textContent = ''; }, autoClear);
    }
  }

  function fmtZoom(z) {
    var p = z * 100;
    if (p >= 100) return p.toFixed(0) + '%';
    if (p >= 10)  return p.toFixed(1) + '%';
    return p.toFixed(2) + '%';
  }

  var ALL_BTN = ['btnSave', 'btnSaveAs', 'btnClose', 'btnReset', 'btnFit', 'btnOne',
                 'inW', 'inH', 'btnHalf', 'btnQuart', 'btnEighth', 'btnDouble',
                 'btnSelect', 'btnSelectAll', 'btnSelectNone', 'btnSelectInv'];

  function setEnabled(on) {
    ALL_BTN.forEach(function (id) { $(id).disabled = !on; });
    updateHistoryUI();
    updateSelectUI();
  }

  /* ================= 历史记录 ================= */
  function resetHistory() {
    history = [{ w: srcW, h: srcH }];
    histIndex = 0;
    updateHistoryUI();
  }

  function pushHistory() {
    if (!hasImage) return;
    var w = targetW, h = targetH;

    if (histIndex >= 0) {
      var c = history[histIndex];
      if (c.w === w && c.h === h) return;
    }

    history.length = histIndex + 1;
    history.push({ w: w, h: h });

    while (history.length > MAX_HISTORY + 1) history.shift();

    histIndex = history.length - 1;
    updateHistoryUI();
  }

  function updateHistoryUI() {
    var has = hasImage;
    $('btnUndo').disabled = !has || histIndex <= 0;
    $('btnRedo').disabled = !has || histIndex >= history.length - 1;

    if (!has) { stHist.textContent = ''; return; }
    stHist.textContent = '历史 ' + histIndex + '/' + (history.length - 1) + ' 步';
  }

  function applyHistoryState() {
    var s = history[histIndex];
    if (!s) return;

    var cx = panX + targetW * zoom / 2;
    var cy = panY + targetH * zoom / 2;

    targetW = s.w;
    targetH = s.h;

    panX = Math.round(cx - targetW * zoom / 2);
    panY = Math.round(cy - targetH * zoom / 2);

    // 尺寸变化会作废选区
    clearSelection(false);

    syncInputs();
    applyResize();
    render();
    updateHistoryUI();
  }

  function undo() {
    if (!hasImage || histIndex <= 0) return;
    histIndex--;
    applyHistoryState();
    setMsg('撤销 → ' + targetW + ' × ' + targetH, 1200);
  }

  function redo() {
    if (!hasImage || histIndex >= history.length - 1) return;
    histIndex++;
    applyHistoryState();
    setMsg('重做 → ' + targetW + ' × ' + targetH, 1200);
  }

  /* ================= 渲染 ================= */
  function render() {
    if (!hasImage) return;
    wrap.style.width  = (targetW * zoom) + 'px';
    wrap.style.height = (targetH * zoom) + 'px';
    wrap.style.transform = 'translate3d(' + panX + 'px,' + panY + 'px,0)';
    updateStatus();
    renderSelectionOverlay();
  }

  function updateStatus() {
    if (!hasImage) {
      stOrig.textContent = '未打开图片';
      stCur.textContent = '';
      stZoom.textContent = '';
      stSel.textContent = '';
      return;
    }
    stOrig.textContent = '原始 ' + srcW + ' × ' + srcH;
    stCur.textContent  = '当前 ' + targetW + ' × ' + targetH;
    stZoom.textContent = '视图 ' + fmtZoom(zoom);
  }

  function updateSelectUI() {
    var has = hasImage;
    $('btnSelect').classList.toggle('on', selectionMode);
    $('btnCopy').disabled = !has || !hasSelection;
    $('btnSelectAll').disabled = !has;
    $('btnSelectNone').disabled = !has || !hasSelection;
    $('btnSelectInv').disabled = !has;

    if (!has) {
      stSel.textContent = '';
      return;
    }
    if (hasSelection) {
      stSel.textContent = '选区 ' + selBounds.w + ' × ' + selBounds.h;
    } else if (selectionMode) {
      stSel.textContent = '选择模式（拖拽框选）';
    } else {
      stSel.textContent = '';
    }
  }

  function syncInputs() {
    if (!hasImage) { inW.value = ''; inH.value = ''; return; }
    inW.value = targetW;
    inH.value = targetH;
  }

  function centerView() {
    panX = Math.round((stage.clientWidth  - targetW * zoom) / 2);
    panY = Math.round((stage.clientHeight - targetH * zoom) / 2);
  }

  function fitView() {
    if (!hasImage) return;
    var pad = 72;
    var aw = Math.max(40, stage.clientWidth  - pad);
    var ah = Math.max(40, stage.clientHeight - pad);
    zoom = clamp(Math.min(aw / targetW, ah / targetH), MIN_ZOOM, 16);
    centerView();
    render();
  }

  /* ================= 核心：最近邻重采样 ================= */
  var cacheImgData = null, cacheW = 0, cacheH = 0;

  function applyResize() {
    if (!hasImage) return;
    if (cv.width === targetW && cv.height === targetH) return;

    var t0 = performance.now();

    cv.width  = targetW;
    cv.height = targetH;
    ctx.imageSmoothingEnabled = false;

    if (!cacheImgData || cacheW !== targetW || cacheH !== targetH) {
      try {
        cacheImgData = ctx.createImageData(targetW, targetH);
        cacheW = targetW;
        cacheH = targetH;
      } catch (err) {
        setMsg('尺寸太大，无法创建画布');
        return;
      }
    }
    var imgData = cacheImgData;
    var dst32 = new Uint32Array(imgData.data.buffer);

    var xmap = new Int32Array(targetW);
    for (var x = 0; x < targetW; x++) {
      var sx = ((x + 0.5) * srcW / targetW) | 0;
      if (sx >= srcW) sx = srcW - 1;
      if (sx < 0) sx = 0;
      xmap[x] = sx;
    }

    for (var y = 0; y < targetH; y++) {
      var sy = ((y + 0.5) * srcH / targetH) | 0;
      if (sy >= srcH) sy = srcH - 1;
      if (sy < 0) sy = 0;

      var sRow = sy * srcW;
      var dRow = y * targetW;
      for (var i = 0; i < targetW; i++) {
        dst32[dRow + i] = src32[sRow + xmap[i]];
      }
    }

    ctx.putImageData(imgData, 0, 0);

    var dt = performance.now() - t0;
    if (dt > 120) setMsg('重采样 ' + dt.toFixed(0) + ' ms', 1800);
  }

  /* ================= 选择系统 ================= */

  function resetSelMask() {
    selMask = new Uint8Array(targetW * targetH);
    hasSelection = false;
    selBounds = { x: 0, y: 0, w: 0, h: 0 };
  }

  function clearSelection(updateUI) {
    if (selMask) selMask.fill(0);
    hasSelection = false;
    selBounds = { x: 0, y: 0, w: 0, h: 0 };
    selDrag = null;
    if (updateUI !== false) {
      updateSelectUI();
      renderSelectionOverlay();
    }
  }

  function recalcSelBounds() {
    if (!selMask) { hasSelection = false; return; }
    var W = targetW, H = targetH;
    var minx = W, miny = H, maxx = -1, maxy = -1;
    for (var y = 0; y < H; y++) {
      var row = y * W;
      for (var x = 0; x < W; x++) {
        if (selMask[row + x]) {
          if (x < minx) minx = x;
          if (x > maxx) maxx = x;
          if (y < miny) miny = y;
          if (y > maxy) maxy = y;
        }
      }
    }
    if (maxx < 0) {
      hasSelection = false;
      selBounds = { x: 0, y: 0, w: 0, h: 0 };
    } else {
      hasSelection = true;
      selBounds = { x: minx, y: miny, w: maxx - minx + 1, h: maxy - miny + 1 };
    }
  }

  function applyRectToSelMask(x0, y0, x1, y1, mode) {
    if (!selMask) resetSelMask();
    var W = targetW, H = targetH;
    x0 = clamp(x0, 0, W);
    y0 = clamp(y0, 0, H);
    x1 = clamp(x1, 0, W);
    y1 = clamp(y1, 0, H);
    if (x1 < x0) { var t = x0; x0 = x1; x1 = t; }
    if (y1 < y0) { var t2 = y0; y0 = y1; y1 = t2; }

    if (mode === 'replace') selMask.fill(0);

    for (var y = y0; y < y1; y++) {
      var row = y * W;
      for (var x = x0; x < x1; x++) {
        if (mode === 'sub') selMask[row + x] = 0;
        else selMask[row + x] = 1;
      }
    }
  }

  function selectAll() {
    if (!hasImage) return;
    if (!selMask) resetSelMask();
    selMask.fill(1);
    recalcSelBounds();
    updateSelectUI();
    renderSelectionOverlay();
    setMsg('已全选', 1200);
  }

  function deselectAll() {
    if (!hasImage) return;
    clearSelection(true);
    setMsg('已取消选择', 1200);
  }

  function invertSelection() {
    if (!hasImage) return;
    if (!selMask) resetSelMask();
    for (var i = 0; i < selMask.length; i++) selMask[i] = selMask[i] ? 0 : 1;
    recalcSelBounds();
    updateSelectUI();
    renderSelectionOverlay();
    setMsg(hasSelection ? '已反选' : '反选后为空', 1200);
  }

  /* ---------- 选择拖拽 ---------- */

  function stagePointFromEvent(e) {
    var rect = stage.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var px = Math.floor((mx - panX) / zoom);
    var py = Math.floor((my - panY) / zoom);
    return { px: px, py: py };
  }

  function beginSelectDrag(e) {
    var p = stagePointFromEvent(e);
    var mode = 'replace';
    if (e.shiftKey) mode = 'add';
    else if (e.ctrlKey || e.metaKey) mode = 'sub';

    selDrag = {
      x0: p.px, y0: p.py,
      x1: p.px, y1: p.py,
      mode: mode
    };
  }

  function updateSelectDrag(e) {
    if (!selDrag) return;
    var p = stagePointFromEvent(e);
    selDrag.x1 = p.px;
    selDrag.y1 = p.py;
    renderSelectionOverlay();
    // 实时显示尺寸
    var r = normalizedDragRect();
    if (r) {
      stSel.textContent = '选区 ' + r.w + ' × ' + r.h + ' px';
    }
  }

  function normalizedDragRect() {
    if (!selDrag) return null;
    var x0 = Math.min(selDrag.x0, selDrag.x1);
    var y0 = Math.min(selDrag.y0, selDrag.y1);
    var x1 = Math.max(selDrag.x0, selDrag.x1);
    var y1 = Math.max(selDrag.y0, selDrag.y1);
    x0 = clamp(x0, 0, targetW);
    y0 = clamp(y0, 0, targetH);
    x1 = clamp(x1, 0, targetW);
    y1 = clamp(y1, 0, targetH);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0, x1: x1, y1: y1 };
  }

  function endSelectDrag() {
    if (!selDrag) return;
    var r = normalizedDragRect();
    var mode = selDrag.mode;
    selDrag = null;

    if (!r || r.w === 0 || r.h === 0) {
      // 没有实际拖动：如果是替换模式，视为点击取消选择
      if (mode === 'replace') {
        clearSelection(true);
      } else {
        renderSelectionOverlay();
        updateSelectUI();
      }
      return;
    }

    applyRectToSelMask(r.x, r.y, r.x1, r.y1, mode);
    recalcSelBounds();
    updateSelectUI();
    renderSelectionOverlay();

    if (hasSelection) {
      setMsg('选区 ' + selBounds.w + ' × ' + selBounds.h +
        (mode === 'add' ? '（加选）' : mode === 'sub' ? '（减选）' : ''), 1400);
    } else {
      setMsg('选区为空', 1200);
    }
  }

  /* ---------- 选区绘制 ---------- */

  function renderSelectionOverlay() {
    if (!hasImage) {
      selCv.style.display = 'none';
      return;
    }
    selCv.style.display = 'block';

    if (selCv.width !== targetW || selCv.height !== targetH) {
      selCv.width = targetW;
      selCv.height = targetH;
    }
    selCtx.clearRect(0, 0, targetW, targetH);
    selCtx.imageSmoothingEnabled = false;

    // 1) 已有选区（按遮罩逐像素绘制）
    if (selMask && hasSelection) {
      var W = targetW;
      var b = selBounds;

      // 半透明填充
      selCtx.fillStyle = 'rgba(80, 180, 255, 0.18)';
      for (var y = b.y; y < b.y + b.h; y++) {
        var row = y * W;
        for (var x = b.x; x < b.x + b.w; x++) {
          if (selMask[row + x]) selCtx.fillRect(x, y, 1, 1);
        }
      }

      // 边缘描边
      var lw = 1 / zoom;
      selCtx.lineWidth = lw;
      selCtx.strokeStyle = 'rgba(0,0,0,0.85)';
      selCtx.beginPath();
      drawMaskEdges(selCtx, W, b);
      selCtx.stroke();

      selCtx.lineWidth = Math.max(lw, 0.5 / zoom);
      selCtx.strokeStyle = 'rgba(255,255,255,0.95)';
      selCtx.beginPath();
      drawMaskEdges(selCtx, W, b);
      selCtx.stroke();
    }

    // 2) 拖拽中的预览矩形
    if (selDrag) {
      var r = normalizedDragRect();
      if (r && r.w > 0 && r.h > 0) {
        selCtx.fillStyle = 'rgba(80, 180, 255, 0.25)';
        selCtx.fillRect(r.x, r.y, r.w, r.h);

        var lw2 = 1 / zoom;
        selCtx.lineWidth = lw2;
        selCtx.strokeStyle = 'rgba(0,0,0,0.9)';
        selCtx.strokeRect(r.x + lw2 * 0.5, r.y + lw2 * 0.5, r.w - lw2, r.h - lw2);
        selCtx.lineWidth = Math.max(lw2, 0.5 / zoom);
        selCtx.strokeStyle = 'rgba(255,255,255,0.95)';
        selCtx.strokeRect(r.x + lw2 * 0.5, r.y + lw2 * 0.5, r.w - lw2, r.h - lw2);
      }
    }
  }

  function drawMaskEdges(c, W, b) {
    for (var y = b.y; y < b.y + b.h; y++) {
      var row = y * W;
      for (var x = b.x; x < b.x + b.w; x++) {
        if (!selMask[row + x]) continue;
        // 上边
        if (y === 0 || !selMask[(y - 1) * W + x]) {
          c.moveTo(x, y); c.lineTo(x + 1, y);
        }
        // 下边
        if (y === targetH - 1 || !selMask[(y + 1) * W + x]) {
          c.moveTo(x, y + 1); c.lineTo(x + 1, y + 1);
        }
        // 左边
        if (x === 0 || !selMask[y * W + (x - 1)]) {
          c.moveTo(x, y); c.lineTo(x, y + 1);
        }
        // 右边
        if (x === targetW - 1 || !selMask[y * W + (x + 1)]) {
          c.moveTo(x + 1, y); c.lineTo(x + 1, y + 1);
        }
      }
    }
  }

  /* ================= 复制到剪贴板 ================= */

  async function doCopy() {
    if (!hasImage) return;
    if (!hasSelection || !selMask) {
      setMsg('没有选区', 1500);
      return;
    }

    var b = selBounds;
    // 从已缩放画布 cv 中提取
    var tmp = document.createElement('canvas');
    tmp.width = b.w;
    tmp.height = b.h;
    var tctx = tmp.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(cv, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);

    // 若选区不是规则矩形，按遮罩抠掉外部
    var needMask = false;
    for (var yy = 0; yy < b.h; yy++) {
      for (var xx = 0; xx < b.w; xx++) {
        if (!selMask[(b.y + yy) * targetW + (b.x + xx)]) {
          needMask = true;
          break;
        }
      }
      if (needMask) break;
    }

    if (needMask) {
      var imgData = tctx.getImageData(0, 0, b.w, b.h);
      var d = imgData.data;
      for (var y = 0; y < b.h; y++) {
        for (var x = 0; x < b.w; x++) {
          if (!selMask[(b.y + y) * targetW + (b.x + x)]) {
            var i = (y * b.w + x) * 4;
            d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 0;
          }
        }
      }
      tctx.putImageData(imgData, 0, 0);
    }

    var blob = await new Promise(function (res) {
      tmp.toBlob(function (bl) { res(bl); }, 'image/png');
    });

    if (!blob) {
      setMsg('导出失败', 2000);
      return;
    }

    // 尝试写入系统剪贴板（跨工具可用）
    var ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.write &&
          typeof ClipboardItem !== 'undefined') {
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        ok = true;
      }
    } catch (err) {
      // 系统剪贴板写入失败，回退下载
    }

    if (ok) {
      setMsg('已复制 ' + b.w + ' × ' + b.h + '（可跨工具粘贴）', 2200);
    } else {
      downloadBlob(blob, 'copy_' + b.w + 'x' + b.h + '.png');
      setMsg('已下载 ' + b.w + ' × ' + b.h + '（浏览器不支持剪贴板）', 2600);
    }
  }

  /* ================= 打开图片 ================= */
  function loadImage(file) {
    if (!file || !/^image\//.test(file.type)) {
      setMsg('请选择图片文件', 2000);
      return;
    }
    setMsg('正在载入…');

    var url = URL.createObjectURL(file);
    var im = new Image();

    im.onload = function () {
      URL.revokeObjectURL(url);

      var w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) { setMsg('图片尺寸无效', 2000); return; }

      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var cx = c.getContext('2d', { willReadFrequently: true });
      cx.imageSmoothingEnabled = false;
      cx.drawImage(im, 0, 0);

      var idata = cx.getImageData(0, 0, w, h);
      src32 = new Uint32Array(idata.data.buffer);
      srcW = w; srcH = h;

      hasImage = true;
      targetW = w; targetH = h;
      baseName = (file.name || 'image').replace(/\.[^.]+$/, '') || 'image';
      fileHandle = null;

      // 重建选区
      resetSelMask();

      placeholder.style.display = 'none';
      wrap.classList.add('on');
      setEnabled(true);

      cv.width = w; cv.height = h;
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(c, 0, 0);
      cacheImgData = null; cacheW = 0; cacheH = 0;

      // 选区 overlay 尺寸
      selCv.width = w;
      selCv.height = h;

      syncInputs();
      resetHistory();
      fitView();
      updateSelectUI();
      setMsg('');
    };

    im.onerror = function () {
      URL.revokeObjectURL(url);
      setMsg('图片解析失败', 2500);
    };

    im.src = url;
  }

  /* ================= 关闭 ================= */
  function closeImage() {
    hasImage = false;
    src32 = null; srcW = 0; srcH = 0;
    targetW = 0; targetH = 0;
    fileHandle = null;
    cacheImgData = null; cacheW = 0; cacheH = 0;

    cv.width = 0; cv.height = 0;
    selCv.width = 0; selCv.height = 0;
    selMask = null;
    hasSelection = false;
    selBounds = { x: 0, y: 0, w: 0, h: 0 };
    selDrag = null;

    wrap.classList.remove('on');
    wrap.style.width = '0px';
    wrap.style.height = '0px';
    placeholder.style.display = '';
    history = []; histIndex = -1;
    setEnabled(false);
    syncInputs();
    updateStatus();
    updateSelectUI();
    setMsg('');
  }

  /* ================= 保存 / 另存为 ================= */
  function defaultFileName() {
    return baseName + '_' + targetW + 'x' + targetH + '.png';
  }

  function canvasToBlob() {
    return new Promise(function (resolve, reject) {
      if (cv.width !== targetW || cv.height !== targetH) applyResize();
      cv.toBlob(function (b) {
        if (b) resolve(b);
        else reject(new Error('导出失败'));
      }, 'image/png');
    });
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  async function writeToHandle(handle, blob) {
    var opts = { mode: 'readwrite' };
    if (handle.queryPermission) {
      var p = await handle.queryPermission(opts);
      if (p !== 'granted' && handle.requestPermission) {
        p = await handle.requestPermission(opts);
      }
      if (p !== 'granted') throw new Error('没有文件写入权限');
    }
    var stream = await handle.createWritable();
    await stream.write(blob);
    await stream.close();
  }

  var supportsFS = (typeof window.showSaveFilePicker === 'function');

  async function doSave() {
    if (!hasImage) return;

    if (fileHandle) {
      try {
        var perm = fileHandle.queryPermission
          ? await fileHandle.queryPermission({ mode: 'readwrite' })
          : 'granted';

        if (perm !== 'granted' && fileHandle.requestPermission) {
          perm = await fileHandle.requestPermission({ mode: 'readwrite' });
        }

        if (perm === 'granted') {
          var blob = await canvasToBlob();
          await writeToHandle(fileHandle, blob);
          setMsg('已保存到 ' + fileHandle.name, 2500);
          return;
        }
        setMsg('文件权限已失效，请用「另存为…」', 3000);
        return;
      } catch (err) {
        setMsg('保存失败：' + (err.message || err), 3000);
        return;
      }
    }

    try {
      var b2 = await canvasToBlob();
      var name = defaultFileName();
      downloadBlob(b2, name);
      setMsg('已下载 ' + name, 2500);
    } catch (err) {
      setMsg('保存失败：' + (err.message || err), 3000);
    }
  }

  async function doSaveAs() {
    if (!hasImage) return;

    var suggested = defaultFileName();
    var handle = null;

    if (supportsFS) {
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: suggested,
          types: [{ description: 'PNG 图片', accept: { 'image/png': ['.png'] } }]
        });
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        handle = null;
      }
    }

    try {
      var blob = await canvasToBlob();

      if (handle) {
        await writeToHandle(handle, blob);
        fileHandle = handle;
        var n = handle.name.replace(/\.[^.]+$/, '');
        if (n) baseName = n;
        setMsg('已另存为 ' + handle.name, 2500);
      } else {
        downloadBlob(blob, suggested);
        setMsg(supportsFS
          ? '已下载 ' + suggested
          : '此浏览器不支持选择位置，已下载到默认目录', 3200);
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      setMsg('另存失败：' + (err.message || err), 3000);
    }
  }

  /* ================= 精确改尺寸 ================= */
  function commitSize(w, h, record) {
    if (!hasImage) return;

    w = clamp(Math.round(w) || 1, 1, MAX_SIZE);
    h = clamp(Math.round(h) || 1, 1, MAX_SIZE);

    if (w * h > MAX_PIXELS) {
      setMsg('尺寸超出上限', 2000);
      syncInputs();
      return;
    }

    var cx = panX + targetW * zoom / 2;
    var cy = panY + targetH * zoom / 2;

    targetW = w; targetH = h;
    panX = Math.round(cx - w * zoom / 2);
    panY = Math.round(cy - h * zoom / 2);

    // 尺寸变化 → 选区作废
    resetSelMask();

    syncInputs();
    applyResize();
    render();
    updateSelectUI();

    if (record !== false) pushHistory();
  }

  function scaleBy(factor) {
    if (!hasImage) return;
    var w = Math.max(1, Math.round(targetW * factor));
    var h = Math.max(1, Math.round(targetH * factor));
    commitSize(w, h, true);
    setMsg('缩放到 ' + w + ' × ' + h, 1200);
  }

  inW.addEventListener('change', function () {
    if (!hasImage) return;
    var w = parseFloat(inW.value);
    if (!isFinite(w) || w < 1) { syncInputs(); return; }
    var h = lockRatio.checked ? w / (targetW / targetH) : targetH;
    commitSize(w, h, true);
  });

  inH.addEventListener('change', function () {
    if (!hasImage) return;
    var h = parseFloat(inH.value);
    if (!isFinite(h) || h < 1) { syncInputs(); return; }
    var w = lockRatio.checked ? h * (targetW / targetH) : targetW;
    commitSize(w, h, true);
  });

  /* ================= 缩放手柄拖拽 ================= */
  Array.prototype.forEach.call(document.querySelectorAll('.handle'), function (el) {
    el.addEventListener('pointerdown', function (e) {
      if (!hasImage || e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      el.setPointerCapture(e.pointerId);

      drag = {
        dir: el.dataset.dir,
        sx: e.clientX, sy: e.clientY,
        w0: targetW, h0: targetH,
        px0: panX, py0: panY,
        z: zoom,
        ratio: targetW / targetH
      };
    });
  });

  function onResizeMove(e) {
    var d = drag;
    var dx = (e.clientX - d.sx) / d.z;
    var dy = (e.clientY - d.sy) / d.z;

    var dir  = d.dir;
    var hasE = dir.indexOf('e') >= 0;
    var hasW = dir.indexOf('w') >= 0;
    var hasN = dir.indexOf('n') >= 0;
    var hasS = dir.indexOf('s') >= 0;

    var w = d.w0, h = d.h0;
    if (hasE) w = d.w0 + dx;
    if (hasW) w = d.w0 - dx;
    if (hasS) h = d.h0 + dy;
    if (hasN) h = d.h0 - dy;

    var lock = (lockRatio.checked !== e.shiftKey);
    var isCorner = (hasE || hasW) && (hasN || hasS);

    if (lock && isCorner) {
      var r = d.ratio;
      var dwRel = Math.abs(w - d.w0) / d.w0;
      var dhRel = Math.abs(h - d.h0) / d.h0;
      if (dwRel >= dhRel) h = w / r;
      else                w = h * r;
    }

    w = clamp(Math.round(w), 1, MAX_SIZE);
    h = clamp(Math.round(h), 1, MAX_SIZE);

    if (w * h > MAX_PIXELS) {
      var k = Math.sqrt(MAX_PIXELS / (w * h));
      w = Math.max(1, Math.floor(w * k));
      h = Math.max(1, Math.floor(h * k));
    }

    var oldW = d.w0 * d.z, oldH = d.h0 * d.z;
    var newW = w * d.z,    newH = h * d.z;

    var px = d.px0, py = d.py0;
    if (hasW) px = d.px0 + oldW - newW;
    if (hasN) py = d.py0 + oldH - newH;

    targetW = w; targetH = h;
    panX = px;   panY = py;

    render();
    syncInputs();
  }

  /* ================= 平移 / 选择 ================= */
  stage.addEventListener('pointerdown', function (e) {
    if (!hasImage) return;
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target && e.target.closest && e.target.closest('.handle')) return;

    // 选择模式：左键拖拽 = 框选
    if (selectionMode && e.button === 0) {
      e.preventDefault();
      stage.setPointerCapture(e.pointerId);
      beginSelectDrag(e);
      return;
    }

    // 否则平移
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    panDrag = { sx: e.clientX, sy: e.clientY, px: panX, py: panY };
    stage.style.cursor = 'grabbing';
  });

  /* ================= 全局指针事件 ================= */
  document.addEventListener('pointermove', function (e) {
    if (selDrag) { updateSelectDrag(e); return; }
    if (drag) { onResizeMove(e); return; }
    if (panDrag) {
      panX = panDrag.px + (e.clientX - panDrag.sx);
      panY = panDrag.py + (e.clientY - panDrag.sy);
      render();
    }
  });

  function endResize() {
    if (!drag) return;
    drag = null;
    if (cv.width !== targetW || cv.height !== targetH) applyResize();
    render();
    pushHistory();
  }

  document.addEventListener('pointerup', function () {
    endResize();
    if (selDrag) endSelectDrag();
    if (panDrag) {
      panDrag = null;
      stage.style.cursor = '';
    }
  });

  document.addEventListener('pointercancel', function () {
    endResize();
    if (selDrag) endSelectDrag();
    panDrag = null;
    stage.style.cursor = '';
  });

  /* ================= 滚轮缩放视图 ================= */
  stage.addEventListener('wheel', function (e) {
    if (!hasImage) return;
    e.preventDefault();

    var rect = stage.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;

    var old = zoom;
    var factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018));
    var nz = clamp(old * factor, MIN_ZOOM, MAX_ZOOM);
    if (nz === old) return;

    var k = nz / old;
    panX = mx - (mx - panX) * k;
    panY = my - (my - panY) * k;
    zoom = nz;

    render();
  }, { passive: false });

  /* ================= 按钮 ================= */
  $('btnOpen').addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) loadImage(fileInput.files[0]);
    fileInput.value = '';
  });

  $('btnSave').addEventListener('click', doSave);
  $('btnSaveAs').addEventListener('click', doSaveAs);
  $('btnClose').addEventListener('click', closeImage);

  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);

  $('btnReset').addEventListener('click', function () {
    if (!hasImage) return;
    commitSize(srcW, srcH, true);
    setMsg('回到原始尺寸 ' + srcW + ' × ' + srcH, 1500);
  });

  $('btnFit').addEventListener('click', fitView);

  $('btnOne').addEventListener('click', function () {
    if (!hasImage) return;
    zoom = 1;
    centerView();
    render();
  });

  $('btnHalf').addEventListener('click',   function () { scaleBy(1 / 2); });
  $('btnQuart').addEventListener('click',  function () { scaleBy(1 / 4); });
  $('btnEighth').addEventListener('click', function () { scaleBy(1 / 8); });
  $('btnDouble').addEventListener('click', function () { scaleBy(2); });

  /* 选择相关按钮 */
  $('btnSelect').addEventListener('click', function () {
    selectionMode = !selectionMode;
    stage.classList.toggle('select-mode', selectionMode);
    updateSelectUI();
    setMsg(selectionMode ? '选择模式：拖拽框选，Shift 加选，Ctrl 减选' : '退出选择模式', 1800);
  });

  $('btnSelectAll').addEventListener('click', selectAll);
  $('btnSelectNone').addEventListener('click', deselectAll);
  $('btnSelectInv').addEventListener('click', invertSelection);
  $('btnCopy').addEventListener('click', doCopy);

  /* ================= 拖放文件 ================= */
  ['dragenter', 'dragover'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadImage(f);
  });

  /* ================= 快捷键 ================= */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    var mod = e.ctrlKey || e.metaKey;
    var k = (e.key || '').toLowerCase();

    if (mod && k === 'o') { e.preventDefault(); fileInput.click(); }
    else if (mod && e.shiftKey && k === 's') { e.preventDefault(); doSaveAs(); }
    else if (mod && k === 's') { e.preventDefault(); doSave(); }
    else if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (mod && k === 'a') { e.preventDefault(); selectAll(); }
    else if (mod && k === 'd') { e.preventDefault(); deselectAll(); }
    else if (mod && k === 'i') { e.preventDefault(); invertSelection(); }
    else if (mod && k === 'c') { e.preventDefault(); doCopy(); }
    else if (!mod && (e.key === 'Escape' || e.key === 'Esc')) {
      e.preventDefault();
      deselectAll();
    }
    else if (!mod && k === 's') {
      // 单按 S 切换选择模式
      e.preventDefault();
      $('btnSelect').click();
    }
    else if (!mod && e.key === '0') { e.preventDefault(); fitView(); }
    else if (!mod && e.key === '1') {
      e.preventDefault();
      if (hasImage) { zoom = 1; centerView(); render(); }
    }
  });

  /* ================= 窗口尺寸变化 ================= */
  window.addEventListener('resize', function () { if (hasImage) render(); });

  /* ================= 初始化 ================= */
  setEnabled(false);
  updateStatus();
  updateSelectUI();

})();
</script>
</body>
</html>
